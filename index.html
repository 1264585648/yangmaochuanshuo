<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161b2b" />
    <meta
      name="description"
      content="羊毛传说 福利抽卡：在云服务器、AI 福利、软件工具和教育优惠中发现值得关注的数字福利。"
    />
    <title>羊毛传说 · 数字福利抽卡</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="羊毛传说" />
    <meta property="og:title" content="羊毛传说 · 抽卡发现全球数字福利" />
    <meta
      property="og:description"
      content="在云服务器、AI 福利、软件工具和教育优惠中抽卡，发现值得关注的数字福利。"
    />
    <meta property="og:url" content="https://free.vibe-show.com/" />
    <meta property="og:image" content="https://free.vibe-show.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="羊毛传说 · 抽卡发现全球数字福利" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles/offers.css" />
    <link rel="stylesheet" href="./styles/motion.css" />
    <link rel="stylesheet" href="./styles/engagement.css" />
  </head>
  <body>
    <div class="world" aria-hidden="true"></div>
    <div class="screen-grain" aria-hidden="true"></div>
    <div class="app">
      <header class="site-header">
        <a class="brand" href="#home" aria-label="羊毛传说 首页">
          <span class="brand-mark" aria-hidden="true"
            ><svg viewBox="0 0 48 48">
              <path d="M24 2 44 13.4v21.2L24 46 4 34.6V13.4L24 2Z" fill="#6f63d3" />
              <path d="m24 8 14 8.2v15.6L24 40 10 31.8V16.2L24 8Z" fill="#cec5fc" />
              <path d="m24 8 14 8.2-14 7.9-14-7.9L24 8Z" fill="#f6f1ff" />
              <path d="M24 24.1 38 16.2v15.6L24 40V24.1Z" fill="#9589ee" />
              <path d="M10 16.2 24 24.1V40l-14-8.2V16.2Z" fill="#564bb2" /></svg
          ></span>
          <span class="brand-word">羊毛传说</span>
          <span class="brand-sub">数字福利</span>
        </a>
        <nav class="main-nav" aria-label="主导航">
          <button type="button" class="nav-link is-active" data-nav="home">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m4 7 8-4 8 4-8 4-8-4Zm0 5 8 4 8-4M4 17l8 4 8-4" /></svg
            >抽卡
          </button>
          <button type="button" class="nav-link" data-nav="collection">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 5.5C4 4 5 3 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Zm0 13.5c0-1.4 1-2.5 2.5-2.5H20"
              /></svg
            ><span class="nav-label"><span class="nav-extra">福利</span>图鉴</span>
          </button>
          <a class="nav-link" href="/offers" id="discoverLink">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="m16 8-2.5 5.5L8 16l2.5-5.5L16 8Z" /></svg
            ><span class="nav-label">发现<span class="nav-extra">优惠</span></span>
          </a>
        </nav>
        <button type="button" class="header-count" id="headerCount">
          <span class="header-count-icon" aria-hidden="true">✦</span
          ><span class="header-count-label">今日<span class="header-count-extra">剩余</span></span
          ><strong id="headerRemaining">3 / 3</strong><span class="header-count-extra">次</span>
        </button>
      </header>

      <main id="home" class="main-content">
        <section class="hero" aria-labelledby="pageTitle">
          <div class="eyebrow">
            <span class="eyebrow-line"></span><span>THE LEGEND OF GREAT DEALS</span
            ><span class="eyebrow-line"></span>
          </div>
          <h1 id="pageTitle">抽卡发现<span>全球数字福利</span></h1>
          <p class="subtitle">
            云服务器 <span>·</span> AI 福利 <span>·</span> 软件工具 <span>·</span> 教育优惠
          </p>
        </section>

        <section class="summon" aria-label="选择福利卡包">
          <div class="stage-aura" aria-hidden="true"></div>
          <div class="table-rune" aria-hidden="true"><div class="rune-ring"></div></div>
          <button type="button" class="switch-arrow prev" id="prevPack" aria-label="上一个卡池">
            <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg>
          </button>
          <div class="pack-scene" id="packScene" role="group" aria-label="四种福利卡池">
            <!-- 卡包由 JavaScript 按数据生成 -->
          </div>
          <button type="button" class="switch-arrow next" id="nextPack" aria-label="下一个卡池">
            <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></svg>
          </button>
          <div class="selected-hint">
            <span class="hint-spark" aria-hidden="true">✦</span
            ><span id="selectedDescription">VPS、云平台赠金与算力体验</span
            ><span class="hint-spark" aria-hidden="true">✦</span>
          </div>
        </section>

        <div class="action-zone">
          <button type="button" class="open-button" id="openPack" disabled aria-busy="true">
            <span class="open-button-art" aria-hidden="true"
              ><svg viewBox="0 0 24 24">
                <path d="M5 5h14l-2 14H7L5 5Zm2.5 5h9M12 5v13" /></svg></span
            ><span id="openLabel">载入卡池…</span
            ><span class="open-arrow" aria-hidden="true">›</span>
          </button>
          <div class="pool-status-line">
            <span id="poolStatus" class="pool-status" data-tone="loading" role="status"
              >正在载入福利目录…</span
            ><button type="button" id="catalogRetry" class="text-link retry-link" hidden>
              重试
            </button>
          </div>
          <div class="game-meta">
            <span>今日剩余 <b id="metaRemaining">3 / 3</b> 次</span
            ><span class="meta-divider" aria-hidden="true"></span
            ><button type="button" id="probabilityButton" class="text-link">
              查看概率 <span aria-hidden="true">ⓘ</span></button
            ><button type="button" id="prizeButton" class="text-link prize-link" hidden>
              ✦ 限定福利
            </button>
          </div>
        </div>
      </main>

      <footer class="bottom-note">
        <span class="note-ornament">✦</span> 抽到的是优惠信息，实际领取资格以官方活动规则为准
        <span class="note-ornament">✦</span>
        <span class="beta-links">
          <button type="button" class="beta-link" id="feedbackButton">意见反馈</button
          ><button type="button" class="beta-link is-community" id="communityButton" hidden>
            加入内测群
          </button>
        </span>
      </footer>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-dim" data-close></div>
      <div class="dialog-frame" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <button class="close-button" type="button" id="closeDialog" aria-label="关闭">×</button>
        <div id="dialogContent"></div>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
